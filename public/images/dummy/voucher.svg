<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0a" />
      <stop offset="100%" stop-color="#1a1a1a" />
    </linearGradient>
    <linearGradient id="voucher" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9333ea" />
      <stop offset="100%" stop-color="#7e22ce" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD700" />
      <stop offset="100%" stop-color="#FFA500" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <rect width="400" height="400" fill="url(#bg)" />
  
  <!-- Outer Glow -->
  <path d="M60 140 L340 140 A 20 20 0 0 1 360 160 L360 240 A 20 20 0 0 1 340 260 L60 260 A 20 20 0 0 1 40 240 L40 160 A 20 20 0 0 1 60 140 Z" fill="none" stroke="#9333ea" stroke-width="4" filter="url(#glow)" opacity="0.5" />
  
  <!-- Voucher Body -->
  <path d="M60 140 L340 140 A 20 20 0 0 1 360 160 L360 180 A 20 20 0 0 0 360 220 L360 240 A 20 20 0 0 1 340 260 L60 260 A 20 20 0 0 1 40 240 L40 220 A 20 20 0 0 0 40 180 L40 160 A 20 20 0 0 1 60 140 Z" fill="url(#voucher)" />
  
  <!-- Dashed Line -->
  <line x1="280" y1="150" x2="280" y2="250" stroke="#ffffff" stroke-width="4" stroke-dasharray="10, 10" opacity="0.5" />
  
  <!-- Star -->
  <path d="M160 170 L165 185 L180 185 L168 195 L172 210 L160 200 L148 210 L152 195 L140 185 L155 185 Z" fill="url(#gold)" filter="url(#glow)" />
  
  <!-- Text -->
  <text x="80" y="225" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#ffffff" letter-spacing="2">PREMIUM</text>
  <text x="80" y="245" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" opacity="0.6">V O U C H E R   G A M E</text>
  
  <!-- Barcode -->
  <rect x="300" y="160" width="6" height="80" fill="#ffffff" opacity="0.8" />
  <rect x="310" y="160" width="12" height="80" fill="#ffffff" opacity="0.8" />
  <rect x="326" y="160" width="4" height="80" fill="#ffffff" opacity="0.8" />
  <rect x="334" y="160" width="8" height="80" fill="#ffffff" opacity="0.8" />
</svg>
