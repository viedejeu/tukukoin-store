<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0a" />
      <stop offset="100%" stop-color="#1a1a1a" />
    </linearGradient>
    <linearGradient id="card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD700" />
      <stop offset="100%" stop-color="#FFA500" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <rect width="400" height="400" fill="url(#bg)" />
  
  <!-- Outer Glow -->
  <rect x="70" y="120" width="260" height="160" rx="20" fill="none" stroke="#3b82f6" stroke-width="4" filter="url(#glow)" opacity="0.5" />
  
  <!-- Credit Card -->
  <rect x="70" y="120" width="260" height="160" rx="20" fill="url(#card)" />
  
  <!-- Waves -->
  <path d="M70 200 Q 135 150 200 200 T 330 200" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.2" />
  <path d="M70 220 Q 135 170 200 220 T 330 220" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.2" />
  
  <!-- Chip -->
  <rect x="100" y="150" width="40" height="30" rx="5" fill="url(#gold)" />
  <path d="M100 165 L140 165 M115 150 L115 180 M125 150 L125 180" stroke="#B8860B" stroke-width="2" />
  
  <!-- Contactless -->
  <path d="M280 140 A 30 30 0 0 1 280 180 M290 130 A 45 45 0 0 1 290 190 M300 120 A 60 60 0 0 1 300 200" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.8" />
  
  <!-- E-Money Text -->
  <text x="100" y="250" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#ffffff" letter-spacing="4">E-MONEY</text>
</svg>
